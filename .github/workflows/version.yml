name: Semantic versioning
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: semantic-version-main
  cancel-in-progress: false

permissions:
  contents: write
  pages: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: node --test tests/*.test.cjs
      - name: Update version and tag
        id: version
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          before=$(git rev-parse HEAD)
          python3 scripts/release.py
          if [ "$before" != "$(git rev-parse HEAD)" ]; then echo 'released=true' >> "$GITHUB_OUTPUT"; fi
      - name: Request Pages build for the release commit
        env:
          GH_TOKEN: ${{ github.token }}
        if: steps.version.outputs.released == 'true' || github.event_name == 'workflow_dispatch'
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cat VERSION)
          if [ "$version" = "2.0.3-alpha" ]; then exit 0; fi
          tag="v$version"
          target=$(git log --first-parent -1 --format=%H -- VERSION)
          test -n "$target"
          test "$(git rev-parse "refs/tags/$tag^{commit}")" = "$target"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-alpha$ ]]
          if gh release view "$tag" >/dev/null 2>&1; then exit 0; fi
          git checkout --detach "$target"
          node --test tests/*.test.cjs
          notes=$(mktemp)
          git show "$target:CHANGELOG.md" | awk -v version="$version" '
            /^## / { if (found) exit; found = ($2 == version); next }
            found { print }
          ' > "$notes"
          grep -q '[^[:space:]]' "$notes"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag --prerelease --title "$tag" --notes-file "$notes"
          fi
