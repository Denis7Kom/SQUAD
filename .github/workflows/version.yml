name: Semantic versioning
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: semantic-version-main
  cancel-in-progress: false

permissions:
  contents: write
  pages: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: node --test tests/*.test.cjs
      - name: Update version and tag
        id: version
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          before=$(git rev-parse HEAD)
          python3 scripts/release.py
          if [ "$before" != "$(git rev-parse HEAD)" ]; then echo 'released=true' >> "$GITHUB_OUTPUT"; fi
      - name: Request Pages build for the release commit
        env:
          GH_TOKEN: ${{ github.token }}
        if: steps.version.outputs.released == 'true' || github.event_name == 'workflow_dispatch'
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
      - name: Verify release commit
        if: steps.version.outputs.released == 'true'
        run: node --test tests/*.test.cjs
      - name: Publish GitHub prerelease
        if: steps.version.outputs.released == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASED: ${{ steps.version.outputs.released }}
        run: |
          version=$(tr -d '\\r\\n' < VERSION)
          tag="v$version"
          if [ "$RELEASED" != true ] && [ "$(git log -1 --format=%s)" != "chore(release): $version" ]; then exit 0; fi
          test "$(git rev-parse "$tag^{commit}")" = "$(git rev-parse HEAD)"
          node --test tests/*.test.cjs
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag --prerelease --generate-notes --title "$tag"
          fi
