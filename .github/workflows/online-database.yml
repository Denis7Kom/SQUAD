name: Online database checks
on:
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/workflows/online-database.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test migrations and access rules in disposable PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres createdb squad_online_test
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d squad_online_test -f "$GITHUB_WORKSPACE/supabase/tests/bootstrap.sql"
          for migration in supabase/migrations/*.sql; do
            sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d squad_online_test -f "$GITHUB_WORKSPACE/$migration"
          done
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d squad_online_test -f "$GITHUB_WORKSPACE/supabase/tests/online_access.sql"
